name: quick-apk

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: master
          cache: true

      - name: fallback dart
        run: |
          mkdir -p lib/secrets
          printf "const String siliconflowFallbackKey = '';\n" > lib/secrets/fallback.dart

      - name: flutter pub get
        run: flutter pub get

      - name: build apk
        run: flutter build apk --release --split-per-abi

      - name: rename
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            abi=$(echo "$f" | sed -E 's/app-(.*)-release\.apk/\1/')
            mv "$f" "Kelivo_master_${V}_${abi}.apk"
          done
          ls -l *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kelivo-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
