name: quick-apk

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: flutter version
        run: flutter --version

      - name: fallback dart
        run: |
          mkdir -p lib/secrets
          printf "const String siliconflowFallbackKey = '';\n" > lib/secrets/fallback.dart

      - name: setup release signing
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGN_KEYSTORE_BASE64" ]; then
            echo "::error::SIGN_KEYSTORE_BASE64 未配置，产出会是未签名 APK，手机装不上"
            exit 1
          fi
          echo "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          {
            echo "storeFile=key.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > android/key.properties
          echo "✅ 签名配置已写入"

      - name: flutter pub get
        run: flutter pub get

      - name: build apk
        run: flutter build apk --release --split-per-abi

      - name: verify signature
        run: |
          unzip -l build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | grep -E 'META-INF/.*\.(RSA|EC|SF)$' || {
            echo "::error::APK 没有 v1 签名，手机可能拒绝安装"; exit 1; }
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | grep -E 'Owner|SHA256' | head -3

      - name: rename
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            abi=$(echo "$f" | sed -E 's/app-(.*)-release\.apk/\1/')
            mv "$f" "Kelivo_master_${V}_${abi}.apk"
          done
          ls -l *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kelivo-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
