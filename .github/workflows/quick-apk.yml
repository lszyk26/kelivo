name: quick-apk

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: flutter version
        run: flutter --version

      - name: fallback dart
        run: |
          mkdir -p lib/secrets
          printf "const String siliconflowFallbackKey = '';\n" > lib/secrets/fallback.dart

      - name: setup release signing
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGN_KEYSTORE_BASE64" ]; then
            echo "::error::SIGN_KEYSTORE_BASE64 未配置，产出会是未签名 APK，手机装不上"
            exit 1
          fi
          echo "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          {
            echo "storeFile=key.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > android/key.properties
          echo "✅ 签名配置已写入"

      - name: preinstall NDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          for i in 1 2 3 4; do
            if sdkmanager --install "ndk;28.2.13676358"; then echo "ndk ok (try $i)"; break; fi
            echo "::warning::ndk install failed, retry $i"
            rm -rf "$ANDROID_HOME/ndk/28.2.13676358"
            sleep 15
          done
          ls -1 "$ANDROID_HOME/ndk"

      - name: flutter pub get
        run: flutter pub get

      - name: build apk
        run: flutter build apk --release --split-per-abi

      - name: rename
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            abi=$(echo "$f" | sed -E 's/app-(.*)-release\.apk/\1/')
            mv "$f" "Kelivo_master_${V}_${abi}.apk"
          done
          ls -l *.apk

      # 先上传产物：即使后面的校验误报，也不至于白跑
      - uses: actions/upload-artifact@v4
        with:
          name: kelivo-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      # 用 apksigner 校验 v2/v3（minSdk>=24 时 AGP 不写 v1 JAR 签名，属于正常）
      - name: verify signature
        run: |
          set -euo pipefail
          BT=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* 2>/dev/null | sort -V | tail -1)
          echo "build-tools: $BT"
          APK=build/app/outputs/flutter-apk/Kelivo_master_*_arm64-v8a.apk
          "$BT/apksigner" verify --verbose --print-certs $APK | tee /tmp/verify.txt
          grep -E "Verified using|Min SDK|Number of signers" /tmp/verify.txt || true

          EXP=$(keytool -list -v -keystore android/app/key.jks \
                  -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
                  -alias "${{ secrets.KEY_ALIAS }}" \
                | grep -m1 "SHA256:" | sed 's/.*SHA256: //' | tr -d ':' | tr 'a-f' 'A-F')
          GOT=$(grep -m1 "certificate SHA-256 digest" /tmp/verify.txt | awk '{print $NF}' | tr -d ':' | tr 'a-f' 'A-F')
          echo "expected=$EXP"
          echo "got=$GOT"
          if [ -z "$GOT" ]; then
            echo "::error::APK 没有有效签名（v2/v3 校验失败）"
            exit 1
          fi
          if [ -n "$EXP" ] && [ "$EXP" != "$GOT" ]; then
            echo "::error::签名证书与密钥库不匹配（可能退回 debug 签名）"
            exit 1
          fi
          echo "✅ 签名校验通过（v2/v3，证书一致）"
